spring:
  application:
    name: address-service
  profiles:
    default: dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 3000ms
  cache:
    type: redis
    redis:
      time-to-live: 86400000 # 24 hours in ms
      cache-null-values: false
      key-prefix: "address:"
      use-key-prefix: true

server:
  port: ${PORT:8082}

app:
  uk-address:
    postcodes-api-url: ${POSTCODES_API_URL:https://api.postcodes.io}
    timeout-ms: ${API_TIMEOUT_MS:3000}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8081,https://pranobkalitalabs.co.uk,https://*.pranobkalitalabs.co.uk}"
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    redis:
      enabled: false
