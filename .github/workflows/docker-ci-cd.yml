name: CI/CD - Build, Test & Push Docker Image

# ==============================================================================
# Workflow: Continuous Integration & Continuous Delivery (CI/CD)
# Author:   Pranob Jyoti Kalita (Pranob Kalita Labs)
# Purpose:  1. Automatically runs unit & integration tests on pull requests & pushes.
#           2. Builds optimized multi-stage Docker images.
#           3. Pushes images to Docker Hub (pkalita/address-service).
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Test & Quality Gate
  # ----------------------------------------------------------------------------
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    # Ephemeral Redis service container for integration testing
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      # Step 1: Check out the source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 JDK with Maven dependency caching
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3: Execute Maven test suite against live Redis service
      - name: Execute Maven Tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: mvn clean test

  # ----------------------------------------------------------------------------
  # Job 2: Build & Push Docker Image to Docker Hub
  # ----------------------------------------------------------------------------
  docker-publish:
    name: Build & Publish to Docker Hub
    needs: test
    # Only push on direct commits to main or version tags, not on pull requests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx for modern container builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with Docker Hub using encrypted repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Generate semantic Docker tags (latest, commit SHA, version tags)
      - name: Generate Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: pkalita/address-service
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Step 5: Build and push container image with GitHub Actions layer caching
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
