services:
  # ============================================================================
  # 1. Distributed Redis Cache (Port 6379)
  # ============================================================================
  address-redis:
    image: redis:7-alpine
    container_name: address-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - address_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 2. UK Address & Geocoding Service (Port 8082)
  # ============================================================================
  address-service:
    image: pkalita/address-service:latest
    container_name: address-service-standalone
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8082
      - REDIS_HOST=address-redis
      - REDIS_PORT=6379
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,https://pranobkalitalabs.co.uk
    depends_on:
      address-redis:
        condition: service_healthy

volumes:
  address_redis_data:
    driver: local
